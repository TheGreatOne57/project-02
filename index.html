<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08060a">
    <title>Two Months With My Princess ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Ambient background particles -->
<div id="particles"></div>

    <main id="app">

        <!-- Opening Screen -->
        <section id="opening" class="screen active">
            <div class="opening-content">
                <div class="number">02</div>
                <div class="subtitle">months</div>
                <div class="small-text">of us.</div>

                <button id="enterButton">
                    Enter Our Little Universe
                </button>
            </div>
        </section>

<!-- Main Universe -->
<section id="universe" class="screen">

    <div class="universe-content">

        <!-- Decorative orbital rings -->
        <div class="orbit-ring ring-one"></div>
        <div class="orbit-ring ring-two"></div>

        <!-- Center -->
        <div class="center-heart">
            <span>S</span>
            <span class="heart">♡</span>
            <span>J</span>

            <small>our little universe</small>
        </div>


        <!-- Her World -->
        <button class="orbit-item item-1" data-section="julia">
            <span class="orbit-icon">✦</span>
            <span class="orbit-label">Her World</span>
        </button>


        <!-- Player 1 + 2 -->
        <button class="orbit-item item-2" data-section="players">
            <span class="orbit-icon">◈</span>
            <span class="orbit-label">Player 1 + 2</span>
        </button>


        <!-- The Little Things -->
        <button class="orbit-item item-3" data-section="little-things">
            <span class="orbit-icon">♡</span>
            <span class="orbit-label">The Little Things</span>
        </button>


        <!-- The First Meeting -->
        <button class="orbit-item item-4" data-section="meeting">
            <span class="orbit-icon">✧</span>
            <span class="orbit-label">The Day You Said "FR?"</span>
        </button>


        <!-- Our Nights -->
        <button class="orbit-item item-5" data-section="nights">
            <span class="orbit-icon">☾</span>
            <span class="orbit-label">Our Nights</span>
        </button>


        <!-- Two Months -->
        <button class="orbit-item item-6" data-section="anniversary">
            <span class="orbit-icon">∞</span>
            <span class="orbit-label">Two Months</span>
        </button>

    </div>

</section>

    </main>

    <script src="main.js"></script>

</body>
</html>
