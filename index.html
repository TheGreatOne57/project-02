<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08060a">
    <title>Two Months With My Princess ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Ambient background particles -->
<div id="particles"></div>

    <main id="app">

        <!-- Opening Screen -->
        <section id="opening" class="screen active">
            <div class="opening-content">
                <div class="number">02</div>
                <div class="subtitle">months</div>
                <div class="small-text">of us.</div>

                <button id="enterButton">
                    Enter Our Little Universe
                </button>
            </div>
        </section>

        <!-- Main Universe -->
        <section id="universe" class="screen">

            <div class="universe-content">

                <div class="center-heart">
                    <span>S</span>
                    <span class="heart">♡</span>
                    <span>J</span>
                </div>

                <div class="orbit-item item-1" data-section="julia">
                    🌷
                    <span>Her World</span>
                </div>

                <div class="orbit-item item-2" data-section="players">
                    🎮
                    <span>Player 1 + 2</span>
                </div>

                <div class="orbit-item item-3" data-section="little-things">
                    🩷
                    <span>The Little Things</span>
                </div>

                <div class="orbit-item item-4" data-section="meeting">
                    🍗
                    <span>The Day You Said "FR?"</span>
                </div>

                <div class="orbit-item item-5" data-section="nights">
                    🌙
                    <span>Our Nights</span>
                </div>

                <div class="orbit-item item-6" data-section="anniversary">
                    ∞
                    <span>Two Months</span>
                </div>

            </div>

        </section>

    </main>

    <script src="main.js"></script>

</body>
</html>
